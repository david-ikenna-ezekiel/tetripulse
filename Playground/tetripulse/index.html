<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TetriPulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <div>
          <p class="eyebrow">Playground · TetriPulse</p>
          <h1>TetriPulse</h1>
        </div>
        <div class="status">
          <span id="statusText">Press Start</span>
        </div>
      </header>

      <main class="game">
        <section class="board">
          <canvas id="board" width="300" height="600"></canvas>
          <div class="hint">
            <span>← → move</span>
            <span>↑ rotate</span>
            <span>↓ soft drop</span>
            <span>space hard drop</span>
            <span>C hold</span>
            <span>P pause</span>
            <span>M sound</span>
            <span>R reset</span>
          </div>
        </section>

        <aside class="panel">
          <div class="card">
            <h2>Hold</h2>
            <canvas id="hold" width="120" height="120"></canvas>
            <p class="muted">Press C to swap</p>
          </div>
          <div class="card">
            <h2>Next</h2>
            <canvas id="next" width="120" height="120"></canvas>
          </div>
          <div class="card">
            <h2>Score</h2>
            <p id="score">0</p>
            <div class="divider"></div>
            <div class="stats">
              <div>
                <span>Lines</span>
                <strong id="lines">0</strong>
              </div>
              <div>
                <span>Level</span>
                <strong id="level">1</strong>
              </div>
              <div>
                <span>High</span>
                <strong id="highScore">0</strong>
              </div>
            </div>
          </div>
          <div class="card">
            <h2>Stage</h2>
            <div id="stageName" class="stage-name">Drift</div>
            <div class="divider"></div>
            <div class="stats">
              <div>
                <span>Progress</span>
                <strong id="stageProgress">0 / 8</strong>
              </div>
              <div>
                <span>Section</span>
                <strong id="stageSection">1 / 3</strong>
              </div>
            </div>
          </div>
          <div class="card">
            <h2>High Scores</h2>
            <ol id="highScoreList" class="score-list"></ol>
          </div>
          <div class="card">
            <h2>Theme</h2>
            <label class="select">
              <span class="muted">Choose theme</span>
              <select id="themeSelect">
                <option value="minimal">Minimal</option>
                <option value="noir">Noir</option>
                <option value="ocean">Ocean</option>
                <option value="ember">Ember</option>
              </select>
            </label>
          </div>
          <div class="controls">
            <button id="toggleBtn">Start</button>
            <button id="resetBtn" class="ghost">Reset</button>
            <button id="soundBtn" class="ghost">Sound: On</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
